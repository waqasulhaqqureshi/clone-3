name: shoot

on:
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/shoot.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Chromium
        run: |
          npm i --no-save playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Serve the clone and photograph it
        run: |
          node server.mjs > /tmp/server.log 2>&1 &
          sleep 2
          curl -s -o /dev/null -w 'server: %{http_code}\n' http://127.0.0.1:5173/home
          node tools/shoot.mjs 2>&1 | tail -60
          echo "--- now the live site at the same sizes, for comparison ---"
          BASE=https://therishithakor.com PREFIX=live- node tools/shoot.mjs 2>&1 | tail -40 || true
          ls -la _shots

      - name: Commit the screenshots
        run: |
          git config user.name "reference-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A _shots
          git commit -m "chore(shots): browser screenshots of the clone" || echo "nothing to commit"
          git fetch -q origin
          git rebase -q origin/${{ github.ref_name }} || true
          git push

