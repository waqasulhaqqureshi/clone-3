name: grab-reference
on:
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/grab-reference.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror the reference site
        run: |
          sudo apt-get -qq update >/dev/null 2>&1 || true
          sudo apt-get -qq install -y wget >/dev/null 2>&1 || true
          mkdir -p _reference
          wget --no-verbose --no-check-certificate -e robots=off \
            --recursive --level=4 --page-requisites --adjust-extension --convert-links \
            --domains=therishithakor.com,cdn.prod.website-files.com,uploads-ssl.webflow.com,d3e54v103j8qbb.cloudfront.net \
            --reject-regex '\.(mp4|webm|mov|zip|avi)$' \
            --no-host-directories --directory-prefix=_reference/site \
            --timeout=25 --tries=2 --waitretry=2 \
            "https://therishithakor.com/home" 2>&1 | tail -20 || true
          rm -rf _reference/site/.netlify
          find _reference -type f -size +4M -print -delete
      - name: Pull the real video media
        run: |
          cd _reference/site
          grep -rhoE 'https://therishithakor\.com/[^"'"'"' )]+\.(mp4|webm|mov)[^"'"'"' )]*' *.html */index.html \
            | sed 's/[?#].*//' | sort -u > /tmp/videos.txt || true
          echo "--- video manifest ---"; cat /tmp/videos.txt
          total=0
          while read -r u; do
            [ -z "$u" ] && continue
            rel=${u#https://therishithakor.com/}
            mkdir -p "$(dirname "$rel")"
            code=$(curl -sS -L --max-time 120 -w '%{http_code}' -o "$rel" "$u" || true)
            sz=$(stat -c %s "$rel" 2>/dev/null || echo 0)
            echo "$code  $sz  $rel"
            total=$((total+sz))
          done < /tmp/videos.txt
          # og image + pwa icon referenced absolutely
          for p in og.jpg icon-512.png; do
            curl -sS -L --max-time 60 -o "$p" "https://therishithakor.com/$p" || true
          done
          du -sh . ; echo "videos total: $total bytes"
      - name: Make every absolute reference local
        run: |
          cd _reference/site
          grep -rl 'https://therishithakor\.com' --include='*.html' . | tee /tmp/rewritten.txt
          xargs -r sed -i 's|https://therishithakor\.com/|/|g' < /tmp/rewritten.txt
          grep -rhoE 'https://therishithakor\.com/?[^"'"'"' )]*' --include='*.html' . | sort -u | head -20 || echo "no absolute refs left"
      - name: Index what we got
        run: |
          python3 - <<'PY'
          import os
          files = []
          for root, _, names in os.walk("_reference"):
              for n in names:
                  p = os.path.join(root, n)
                  files.append((p, os.path.getsize(p)))
          files.sort()
          with open("_reference/INDEX.txt", "w") as f:
              for p, s in files:
                  f.write(f"{s:>10}  {p}\n")
          print(f"{len(files)} files, {sum(s for _, s in files)/1e6:.1f} MB")
          PY
      - name: Commit
        run: |
          git config user.name "reference-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A _reference
          git commit -m "chore(reference): mirror media, videos and localise absolute urls" || echo "nothing to commit"
          git fetch -q origin
          git rebase -q origin/${{ github.ref_name }} || true
          git push
